# Example config file.
# Real path: ~/.config/studioctl/config.toml
#
# Each [dirs.<name>] entry is a Directory: a local path, and the rclone
# remotes it is backed up to. A remote is the exact destination, not a
# parent directory - the Directory's contents land in it directly. A leading
# "~/" in a path means your home directory.
#
# Two names are special: "projects" (your Ableton Projects) and "demos"
# (where demo bounces land). Commands that need them look them up by name.
# Every other Directory is only backed up.

[dirs.projects]
path = "~/Music/Projects"
remotes = ["r2:my-bucket/projects", "nas:music/projects"]

[dirs.demos]
path = "~/Music/Demos"
remotes = ["gdrive:my-demos"]

# Anything else you want backed up: the Ableton User Library, a samples
# drive, premasters, ...
[dirs.user-library]
path = "~/Music/Ableton/User Library"
remotes = ["r2:my-bucket/user-library"]
